spring.application.name=OnlineDoctorsClinic

# Database Connection (Aiven Cloud MySQL)
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://doctors-clinic1-mparadkar.i.aivencloud.com:11588/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:${MYSQL_PASSWORD:${AIVEN_PASSWORD:${PASSWORD:}}}}}

# JDBC Driver
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Hibernate (update preserves registered accounts across restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Connection Pool Settings
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# Server Port (Reads from cloud PORT or defaults to 8080)
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.web=DEBUG

# ==============================================================================
# Gmail SMTP Configuration
# ==============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:mparadkar671@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true