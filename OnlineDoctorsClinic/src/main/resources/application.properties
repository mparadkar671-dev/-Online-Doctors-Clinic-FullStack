spring.application.name=OnlineDoctorsClinic

# Database Connection (Reads from cloud environment or defaults to local MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doctors_clinic}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

# JDBC Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate (update preserves registered accounts across restarts)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Server Port (Reads from cloud PORT or defaults to 8080)
server.port=${PORT:8080}

# Logging
logging.level.org.springframework.web=DEBUG

# ==============================================================================
# Gmail SMTP Configuration
# ==============================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:mparadkar671@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true