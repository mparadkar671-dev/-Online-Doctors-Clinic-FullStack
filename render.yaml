services:
  # ============================================================================
  # 1. Spring Boot Backend Web Service (Java 21 / Docker)
  # ============================================================================
  - type: web
    name: medipulse-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: OnlineDoctorsClinic
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false # Set in Render dashboard (e.g. Aiven/TiDB MySQL URL)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        value: mparadkar671@gmail.com
      - key: MAIL_PASSWORD
        sync: false

  # ============================================================================
  # 2. React Frontend Static Site (100% Free Forever, Fast Global CDN)
  # ============================================================================
  - type: web
    name: medipulse-frontend
    env: static
    rootDir: clinic-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_BASE_URL
        sync: false # Set to your deployed backend URL
